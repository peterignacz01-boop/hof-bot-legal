<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hall of Fame Bot — Legal</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0f1115; --card:#171a21; --text:#f3f4f6; --muted:#aab1bd;
    --border:#2b313c; --accent:#8ea1ff;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif; background:var(--bg); color:var(--text); line-height:1.65;
  }
  main { max-width: 860px; margin: 0 auto; padding: 56px 20px 80px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px; }
  h1 { margin-top:0; font-size:2rem; }
  h2 { margin-top:2rem; font-size:1.15rem; }
  p, li { color:var(--muted); }
  a { color:var(--accent); }
  .meta { font-size:.95rem; color:var(--muted); margin-bottom:2rem; }
  nav { margin-bottom:20px; }
  nav a { margin-right:16px; }
  code { color:var(--text); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Hall of Fame Bot</h1>
    <p>Legal information for the Hall of Fame Discord bot.</p>
    <p><a href="terms.html">Terms of Service</a></p>
    <p><a href="privacy.html">Privacy Policy</a></p>
  </div>
</main>
</body>
</html>
